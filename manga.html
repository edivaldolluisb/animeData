<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de animes e mangás">
    <meta name="author" content="Edivaldo">
    <link rel="shortcut icon" href="./icones/icons8-naruto-sign-210.png" type="image/x-icon">

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./anime.css">
    <meta name="theme-color" content="#dcb67d">
    <style>
        #menu_anime { background-color: var(--surface); color: var(--text); }
        #menu_anime:hover { background-color: var(--surface); }
        #menu_manga { background-color: var(--green); color: #fff; }
        #menu_manga:hover { background-color: var(--green-dark); }
    </style>

    <title>Mangás</title>
</head>

<body>
    <!--Menu de navegação-->
    <nav>
        <a href="./index.html" id="menu_anime">Anime</a>
        <a href="#" id="menu_manga" aria-current="page">Mangá</a>
    </nav>

    <!--bara de pesquisa-->
    <div id="div_de_pesquisa">
        <form action="" method="get" role="search" aria-label="Pesquisar mangás" onsubmit="return false">
            <input type="search" name="" id="bara_de_pesquisa" placeholder="Buscar por nome…" aria-label="Pesquisar mangás">
        </form>
    </div>

    <main>
    <h1>Minha lista de <span>Mangás</span></h1>
    <div id="total_filtrados">
        <span id="total_resultados" aria-live="polite">Total de resultados: </span>
        <select name="" id="filtro" aria-label="Filtrar por status">
            <option value="">Todos</option>
            <option value="lendo">Lendo</option>
            <option value="completo">Completos</option>
            <option value="dropado">Dropado</option>
        </select>
    </div>

    <!--Tabela-->
    <table>
        <caption>Lista de mangás</caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="corpo_tabela_animes">
        </tbody>
    </table>

    <!--Pagination-->
    <div class="pagination" role="navigation" aria-label="Paginação">
        <a href="#">&laquo;</a>
        <a href="#">&raquo;</a>
    </div>
    </main>

    <script src="./sw.js"></script>
    <script src="./js/manga.js"></script>

</body>

</html>
