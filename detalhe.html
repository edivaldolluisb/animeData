<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de animes e mangás">
    <meta name="author" content="Edivaldo">
    <link rel="shortcut icon" href="./icones/icons8-naruto-sign-210.png" type="image/x-icon">

    <link rel="stylesheet" href="./anime.css">
    <link rel="stylesheet" href="./detalhe.css">
    <meta name="theme-color" content="#dcb67d">

    <title>Detalhe</title>
</head>

<body>
    <!--Menu de navegação-->
    <nav>
        <a href="./index.html" id="menu_anime">Anime</a>
        <a href="./manga.html" id="menu_manga">Mangá</a>
        <a href="./mal.html" id="menu_mal">MAL</a>
    </nav>

    <main>
<section id="dados_detalhe">
        <!--imagem-->

        <img id="imagem_anime" src="data:," alt="" loading="lazy">

        <!--dados-->
        <div>
            <h2 id="nome_anime"></h2>
            <p id="nome_eng"></p>
            <div id="meta">
                <p id="status" class="status-badge"></p>
                <p id="cap"></p>
                <p id="posicao"></p>
                <a id="link_mal" target="_blank" rel="noopener" hidden>Ver no MyAnimeList ↗</a>
            </div>
        </div>
    </section>
    <p id="erro" hidden></p>
    <nav id="nav_detalhe" aria-label="Navegar entre entradas">
        <a href="#" id="btn-prev" hidden>← Anterior</a>
        <a href="#" id="btn-next" hidden>Próximo →</a>
    </nav>
    </main>

    <script>

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");
        const tipo = params.get("tipo");

        const activeNavId = { manga: 'menu_manga', mal: 'menu_mal' }[tipo] || 'menu_anime';
        document.getElementById(activeNavId).setAttribute('aria-current', 'page');

        buildanimeDetail(id, tipo)

        //listar os dados do anime
        function buildanimeDetail(id, tipo) {

            var nome_anime, status, nome_eng
            var imagem_anime = document.querySelector('#imagem_anime')
            nome_anime = document.querySelector('#nome_anime')
            status = document.querySelector('#status')
            nome_eng = document.querySelector('#nome_eng')

            var cap = document.querySelector('#cap')
            cap.style.display = 'none'

            var url = "./dados/animes.json"
            if (tipo == "manga") {
                url = "./dados/mangas.json"
            } else if (tipo == "mal") {
                url = "./dados/mal.json"
            }

            fetch(url)
                .then((resp) => {
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    return resp.json();
                })
                .then(function (data) {
                    // console.log('Data:', data)

                    let anime;
                    let array_dados = data.animes

                    if (tipo == 'manga') {
                        array_dados = data.mangas
                    }

                    const idx = array_dados.findIndex(item => item.Id == id);
                    anime = array_dados[idx];

                    if (!anime) {
                        mostrarErro('Entrada não encontrada na lista.');
                        return;
                    }

                    const btnPrev = document.getElementById('btn-prev');
                    const btnNext = document.getElementById('btn-next');
                    const prevItem = array_dados[idx - 1];
                    const nextItem = array_dados[idx + 1];
                    if (prevItem) {
                        btnPrev.href = `./detalhe.html?id=${prevItem.Id}&tipo=${tipo}`;
                        btnPrev.textContent = `← ${prevItem.Nome_jp}`;
                        btnPrev.title = prevItem.Nome_jp;
                        btnPrev.removeAttribute('hidden');
                    }
                    if (nextItem) {
                        btnNext.href = `./detalhe.html?id=${nextItem.Id}&tipo=${tipo}`;
                        btnNext.textContent = `${nextItem.Nome_jp} →`;
                        btnNext.title = nextItem.Nome_jp;
                        btnNext.removeAttribute('hidden');
                    }

                    const posicao = document.getElementById('posicao');
                    posicao.textContent = `nº ${idx + 1} de ${array_dados.length} na lista`;
                    posicao.style.display = 'block';

                    document.title = anime.Nome_jp
                    nome_anime.textContent = anime.Nome_jp

                    if (anime.Image) {
                        imagem_anime.src = anime.Image
                        imagem_anime.alt = anime.Nome_jp
                    }

                    nome_eng.style.display = 'none'
                    if (anime.Nome_eng) {
                        nome_eng.style.display = 'block'
                        nome_eng.textContent = anime.Nome_eng
                    }

                    status.textContent = anime.Status
                    status.dataset.status = anime.Status.toLowerCase()

                    cap.style.display = 'none'
                    if (tipo === 'manga' && anime.cap) {
                        cap.style.display = 'block'
                        cap.textContent = 'Capítulo ' + anime.cap
                    } else if (tipo !== 'manga' && anime.ep) {
                        cap.style.display = 'block'
                        cap.textContent = 'Episódio ' + anime.ep + (anime.eps ? ' de ' + anime.eps : '')
                    }

                    if (tipo === 'mal') {
                        const linkMal = document.getElementById('link_mal');
                        linkMal.href = `https://myanimelist.net/anime/${anime.Id}`;
                        linkMal.removeAttribute('hidden');
                    }

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowLeft' && !btnPrev.hidden) btnPrev.click();
                        if (e.key === 'ArrowRight' && !btnNext.hidden) btnNext.click();
                    });

                })
                .catch((err) => {
                    console.error('Erro ao carregar detalhe:', err);
                    mostrarErro('Não foi possível carregar os dados. Verifique a conexão e recarregue a página.');
                })

        }

        function mostrarErro(mensagem) {
            document.getElementById('dados_detalhe').hidden = true;
            document.getElementById('nav_detalhe').hidden = true;
            const erro = document.getElementById('erro');
            erro.textContent = mensagem;
            erro.removeAttribute('hidden');
        }



    </script>




</body>

</html>
