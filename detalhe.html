<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de animes e mangás">
    <meta name="author" content="Edivaldo">
    <link rel="shortcut icon" href="./icones/icons8-naruto-sign-210.png" type="image/x-icon">

    <link rel="stylesheet" href="./anime.css">
    <link rel="stylesheet" href="./detalhe.css">
    <meta name="theme-color" content="#dcb67d">

    <title>Detalhe</title>
</head>

<body>
    <!--Menu de navegação-->
    <nav>
        <a href="./index.html" id="menu_anime">Anime</a>
        <a href="./manga.html" id="menu_manga">Mangá</a>
    </nav>

    <main>
    <a href="javascript:history.back()" id="btn-voltar">← Voltar</a>
    <section id="dados_detalhe">
        <!--imagem-->

        <img id="imagem_anime" src="./imagens/haikkyu.jpg" alt="">

        <!--dados-->
        <div>
            <p id="nome_anime">Nome do anime</p>
            <p id="nome_eng">Nome alternativo: </p>
            <p id="status">Status: </p>
            <p id="cap">Capítulo: </p>
        </div>
    </section>
    </main>

    <script>

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");
        const tipo = params.get("tipo");

        //console.log(id, tipo);
        buildanimeDetail(id, tipo)

        //listar os dados do anime
        function buildanimeDetail(id, tipo) {

            var nome_anime, status, nome_eng
            var imagem_anime = document.querySelector('#imagem_anime')
            nome_anime = document.querySelector('#nome_anime')
            status = document.querySelector('#status')
            nome_eng = document.querySelector('#nome_eng')

            var cap = document.querySelector('#cap')
            cap.style.display = 'none'

            var url = "./dados/animes.json"
            if (tipo == "manga") {
                url = "./dados/mangas.json"
            }

            fetch(url)
                .then((resp) => resp.json())
                .then(function (data) {
                    // console.log('Data:', data)

                    let anime;
                    let array_dados = data.animes

                    if (tipo == 'manga') {
                        array_dados = data.mangas
                    }

                    //get anime
                    for (const $anime of array_dados) {

                        if ($anime.Id == id) {
                            anime = $anime;
                        }
                    }

                    //verficar se o anime tem imagem
                    if (anime.Image != '') {
                        //try getting the image, and check for errors
                        
                        // fetch(anime.Image)
                        //     .then((response) => {
                        //         if (response.ok) {
                        //             imagem_anime.src = anime.Image
                        //         } else {
                        //             imagem_anime.src = './imagens/haikkyu.jpg'
                        //         }
                        //     })
                        //     .catch((error) => {
                        //         console.error('Error:', error);
                        //     });
                        
                        imagem_anime.src = anime.Image
                        imagem_anime.alt = anime.Nome_jp
                        document.title = anime.Nome_jp
                    }
                    nome_anime.textContent = anime.Nome_jp

                    nome_eng.style.display = 'none'
                    if (anime.Nome_eng != '') {
                        nome_eng.style.display = 'block'
                        nome_eng.textContent = `Nome alternativo: ${anime.Nome_eng}`
                    }
                    status.textContent = `Status: ${anime.Status}`

                    if (anime.cap) {
                        cap.style.display = 'block'
                        cap.textContent = `Capítulo: ${anime.cap}`
                    }


                })

        }



    </script>




</body>

</html>
