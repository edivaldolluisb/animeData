<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de animes e mangás">
    <meta name="author" content="Edivaldo">
    <link rel="shortcut icon" href="./icones/icons8-naruto-sign-210.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;600&family=Kalam:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="./anime.css">
    <link rel="stylesheet" href="./detalhe.css">
    <meta name="theme-color" content="#e9e6dc">

    <title>Detalhe</title>
</head>

<body>
    <header class="masthead">
        <a class="marca" href="./index.html">Ani-Mangalist<span lang="ja">目録</span></a>
        <nav aria-label="Listas">
            <a href="./index.html" id="menu_anime">Anime</a>
            <a href="./manga.html" id="menu_manga">Mangá</a>
            <a class="github" href="https://github.com/edivaldolluisb/animeData" target="_blank" rel="noopener" aria-label="Código no GitHub" title="Código no GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
        </nav>
    </header>

    <main>
        <article id="dados_detalhe">
            <figure class="prancha">
                <img id="imagem_anime" src="data:," alt="">
            </figure>

            <div class="ficha">
                <p id="posicao"></p>
                <h1 id="nome_anime"></h1>
                <p id="nome_eng"></p>

                <dl id="meta">
                    <div>
                        <dt>Status</dt>
                        <dd><span id="status"></span></dd>
                    </div>
                    <div id="progresso" hidden>
                        <dt>Progresso</dt>
                        <dd>
                            <span id="cap"></span>
                            <span id="ticks" aria-hidden="true"></span>
                        </dd>
                    </div>
                    <div id="nota" hidden>
                        <dt>Nota</dt>
                        <dd><span id="nota_valor"></span></dd>
                    </div>
                </dl>

                <p id="links"></p>
            </div>
        </article>

        <p id="erro" class="aviso" hidden></p>

        <nav id="nav_detalhe" aria-label="Navegar entre entradas">
            <a href="#" id="btn-prev" hidden></a>
            <a href="#" id="btn-next" hidden></a>
        </nav>
    </main>

    <footer class="colofao">
        <p><span lang="ja">目録</span> Ani-Mangalist — lista pessoal de animes e mangás.</p>
        <a class="fork" href="https://github.com/edivaldolluisb/animeData" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> Faz fork no GitHub</a>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const tipo = params.get('tipo');

        // animes vêm do MyAnimeList (dados/mal.json); "tipo=mal" fica por compatibilidade com links antigos
        const ehManga = tipo === 'manga';
        document.getElementById(ehManga ? 'menu_manga' : 'menu_anime').setAttribute('aria-current', 'page');

        const url = ehManga ? './dados/mangas.json' : './dados/mal.json';

        fetch(url)
            .then(resp => {
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                return resp.json();
            })
            .then(data => {
                const lista = tipo === 'manga' ? data.mangas : data.animes;
                const idx = lista.findIndex(item => item.Id == id);
                const item = lista[idx];

                if (!item) {
                    mostrarErro('Entrada não encontrada na lista.');
                    return;
                }

                const ligar = (el, alvo, texto) => {
                    if (!alvo) return;
                    el.href = `./detalhe.html?id=${alvo.Id}&tipo=${tipo}`;
                    el.textContent = texto(alvo.Nome_jp);
                    el.title = alvo.Nome_jp;
                    el.removeAttribute('hidden');
                };
                const btnPrev = document.getElementById('btn-prev');
                const btnNext = document.getElementById('btn-next');
                ligar(btnPrev, lista[idx - 1], nome => `← ${nome}`);
                ligar(btnNext, lista[idx + 1], nome => `${nome} →`);

                document.getElementById('posicao').textContent = `Nº ${String(idx + 1).padStart(3, '0')} de ${lista.length}`;

                document.title = item.Nome_jp;
                document.getElementById('nome_anime').textContent = item.Nome_jp;

                const img = document.getElementById('imagem_anime');
                if (item.Image) {
                    img.src = item.Image;
                    img.alt = `Capa de ${item.Nome_jp}`;
                }

                const nomeEng = document.getElementById('nome_eng');
                if (item.Nome_eng && item.Nome_eng !== item.Nome_jp) {
                    nomeEng.textContent = item.Nome_eng;
                    nomeEng.style.display = 'block';
                }

                const status = document.getElementById('status');
                status.textContent = item.Status;
                status.dataset.status = item.Status.toLowerCase();

                const feito = ehManga ? item.cap : item.ep;
                const total = ehManga ? item.caps : item.eps;
                if (feito) {
                    const unidade = ehManga ? 'Capítulo' : 'Episódio';
                    document.getElementById('cap').textContent = `${unidade} ${feito}${total ? ' de ' + total : ''}`;
                    // uma casa por episódio, como uma ficha de presença
                    if (total && total <= 100) {
                        const ticks = document.getElementById('ticks');
                        for (let i = 1; i <= total; i++) {
                            const t = document.createElement('i');
                            if (i <= feito) t.className = 'on';
                            ticks.appendChild(t);
                        }
                    }
                    document.getElementById('progresso').hidden = false;
                }

                if (item.score) {
                    document.getElementById('nota_valor').textContent = `${item.score}/10`;
                    document.getElementById('nota').hidden = false;
                }

                const fontes = ehManga
                    ? [['MyAnimeList', item.mal && `https://myanimelist.net/manga/${item.mal}`],
                       ['AniList', item.anilist && `https://anilist.co/manga/${item.anilist}`],
                       ['MangaUpdates', item.mangaupdates && `https://www.mangaupdates.com/series/${item.mangaupdates}`]]
                    : [['MyAnimeList', `https://myanimelist.net/anime/${item.Id}`]];
                document.getElementById('links').replaceChildren(...fontes.filter(([, href]) => href).map(([nome, href]) => {
                    const a = document.createElement('a');
                    a.href = href;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.innerHTML = `Ver no ${nome} <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 L11 5 M6 5 H11 V10"/></svg>`;
                    return a;
                }));

                document.addEventListener('keydown', e => {
                    if (e.key === 'ArrowLeft' && !btnPrev.hidden) btnPrev.click();
                    if (e.key === 'ArrowRight' && !btnNext.hidden) btnNext.click();
                });
            })
            .catch(err => {
                console.error('Erro ao carregar detalhe:', err);
                mostrarErro('Não foi possível carregar os dados. Verifique a conexão e recarregue a página.');
            });

        function mostrarErro(mensagem) {
            document.getElementById('dados_detalhe').hidden = true;
            document.getElementById('nav_detalhe').hidden = true;
            const erro = document.getElementById('erro');
            erro.textContent = mensagem;
            erro.removeAttribute('hidden');
        }
    </script>
</body>

</html>
