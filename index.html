    THESIS: a coleção é um catálogo de convenção doujin, não uma tabela nem um app de streaming; recusa linhas zebradas e o grid escuro de posters.
    OWN-WORLD: papel de jornal #e9e6dc com retícula, uma tinta #1a1a1a, caneta vermelha #c8291f só para marcas à mão; capas a uma tinta em células com fios de 1px; Zen Kaku Gothic New 900, M PLUS 1 Code para códigos, Kalam para a caneta.
    STORY: o visitante vê primeiro o que está a ser visto (circulado), confirma se um título existe pela pesquisa e folheia o resto por halls.
    FIRST VIEWPORT: barra fina com marca e listas; título enorme à esquerda com contagem; pesquisa sublinhada e filtros com contagem; Hall A a cores, circulado a caneta.
    FORM: challenger pop-culture-shelf-doujin-event-catalog fundido com tipografia de anuário; seed 065767b2.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
