<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de animes e mangás">
    <meta name="author" content="Edivaldo">
    <link rel="shortcut icon" href="./icones/icons8-naruto-sign-210.png" type="image/x-icon">
    <!--PWA-->
    <link rel="manifest" href="./manifest.json">

    <link rel="stylesheet" href="./anime.css">
    <meta name="theme-color" content="#dcb67d">

    <title>Animes</title>
</head>

<body>
    <!--Menu de navegação-->
    <nav>
        <a href="#" id="menu_anime" aria-current="page">Anime</a>
        <a href="./manga.html" id="menu_manga">Mangá</a>
    </nav>

    <!--bara de pesquisa-->
    <div id="div_de_pesquisa">
        <form action="" method="get" role="search" aria-label="Pesquisar animes" onsubmit="return false">
            <input type="search" name="" id="bara_de_pesquisa" placeholder="Pesquise" aria-label="Pesquisar animes">
        </form>
    </div>

    <main>
    <h1>Minha lista de <span>Animes</span></h1>
    <div id="total_filtrados">
        <span id="total_resultados" aria-live="polite">Total de resultados: </span>
        <select name="" id="filtro" aria-label="Filtrar por status">
            <option value="">Todos</option>
            <option value="completo">Completos</option>
            <option value="assistindo">Assistindo</option>
            <option value="pretendo assistir">Pretendo Assistir</option>
            <option value="dropado">Dropado</option>
        </select>
    </div>

    <!--Tabela-->
    <table>
        <caption>Lista de animes</caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="corpo_tabela_animes">
        </tbody>
    </table>

    <!--Pagination-->
    <div class="pagination" role="navigation" aria-label="Paginação">
        <a href="#">&laquo;</a>
        <a href="#">&raquo;</a>
    </div>
    </main>

    <!--PWA-->
    <script src="./sw.js"></script>
    <script src="./js/index.js"></script>

    
</body>

</html>
